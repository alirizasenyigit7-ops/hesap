<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Muhasebe — Şablonlu Fatura, Bütçe ve Finans Yönetim Uygulaması">
  <title>Muhasebe — Fatura & Finans Yönetimi</title>
  
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- CSS Design System -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="app" class="app">
    <!-- Sidebar rendered dynamically via JS -->
    <aside id="sidebar-container"></aside>
    
    <!-- Main Content Area -->
    <main class="content-wrapper">
      <!-- Mobile Header / Top Bar -->
      <header class="mobile-header">
        <button id="menu-toggle-btn" class="menu-toggle" aria-label="Menüyü Aç">
          <i data-lucide="menu"></i>
        </button>
        <div class="mobile-brand">
          <span class="mobile-logo">₺</span>
          <span class="mobile-title">Muhasebe</span>
        </div>
      </header>

      <!-- Dynamic Page Container -->
      <section id="page-content" class="page-container" tabindex="-1"></section>
    </main>
  </div>

  <!-- Global Modal Container -->
  <div id="modal-container"></div>

  <!-- Global Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main JavaScript App -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
